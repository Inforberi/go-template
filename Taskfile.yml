version: '3'

vars:
    DEV_COMPOSE: docker compose --project-directory . --env-file .env -f deploy/compose.dev.yml
    PROD_COMPOSE: docker compose --project-directory . --env-file .env.prod -f deploy/compose.prod.yml
    LOGS_COMPOSE: docker compose --project-directory . -f deploy/compose.logs.yml

tasks:
    # Development
    dev:up:
        desc: Start development environment
        cmds:
            - '{{.DEV_COMPOSE}} up -d --wait postgres'
            - |
                if ls migrations/*.up.sql >/dev/null 2>&1; then
                    {{.DEV_COMPOSE}} run --rm migrate
                else
                    echo "No migrations found, skipping"
                fi
            - '{{.DEV_COMPOSE}} up -d --build --wait api'

    dev:down:
        desc: Stop development environment
        cmds:
            - '{{.DEV_COMPOSE}} down'

    dev:logs:
        desc: Follow development API logs
        cmds:
            - '{{.DEV_COMPOSE}} logs -f --tail=200 api'

    dev:ps:
        desc: Show development containers
        cmds:
            - '{{.DEV_COMPOSE}} ps'

    # Migrations
    migrate:create:
        desc: Create a new SQL migration
        requires:
            vars:
                - NAME
        cmds:
            - '{{.DEV_COMPOSE}} run --rm --no-deps --entrypoint migrate migrate create -ext sql -dir /migrations -seq {{.NAME}}'

    migrate:up:
        desc: Apply all pending migrations
        cmds:
            - '{{.DEV_COMPOSE}} up -d --wait postgres'
            - '{{.DEV_COMPOSE}} run --rm migrate up'

    migrate:down:
        desc: Roll back one migration
        cmds:
            - '{{.DEV_COMPOSE}} up -d --wait postgres'
            - '{{.DEV_COMPOSE}} run --rm migrate down 1'

    migrate:version:
        desc: Show current migration version
        cmds:
            - '{{.DEV_COMPOSE}} up -d --wait postgres'
            - '{{.DEV_COMPOSE}} run --rm migrate version'

    # Go
    go:fmt:
        desc: Format Go source code
        cmds:
            - go fmt ./...

    go:vet:
        desc: Run Go static analysis
        cmds:
            - go vet ./...

    go:build:
        desc: Build API locally
        cmds:
            - mkdir -p bin
            - go build -mod=readonly -trimpath -o ./bin/api ./cmd/api

    # Swagger
    swagger:fmt:
        desc: Format Swagger annotations
        cmds:
            - go run github.com/swaggo/swag/cmd/swag@v1.16.6 fmt -g cmd/api/main.go

    swagger:generate:
        desc: Generate Swagger documentation
        cmds:
            - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/api/main.go --parseInternal -o docs

    # PostgreSQL backups
    backup:create:
        desc: Create a production PostgreSQL backup
        cmds:
            - ./deploy/scripts/postgres-maintenance.sh prepare
            - '{{.PROD_COMPOSE}} up -d --wait postgres'
            - '{{.PROD_COMPOSE}} run --rm --no-deps backup create'

    backup:list:
        desc: List valid production PostgreSQL backups
        cmds:
            - ./deploy/scripts/postgres-maintenance.sh prepare
            - '{{.PROD_COMPOSE}} run --rm --no-deps backup list'

    backup:logs:
        desc: Follow production PostgreSQL backup logs
        cmds:
            - '{{.PROD_COMPOSE}} logs -f --tail=200 backup'

    backup:restore:
        desc: Restore production PostgreSQL from a backup
        requires:
            vars:
                - FILE
                - CONFIRM
        env:
            RESTORE_FILE: '{{.FILE}}'
            RESTORE_CONFIRM: '{{.CONFIRM}}'
        cmds:
            - ./deploy/scripts/postgres-maintenance.sh prepare
            - '{{.PROD_COMPOSE}} up -d --wait postgres'
            - ./deploy/scripts/postgres-maintenance.sh restore

    # Production
    prod:deploy:
        desc: Deploy production application
        cmds:
            - ./deploy/scripts/postgres-maintenance.sh prepare
            - '{{.PROD_COMPOSE}} pull postgres migrate backup api'
            - '{{.PROD_COMPOSE}} up -d --wait postgres'
            - |
                if ls migrations/*.up.sql >/dev/null 2>&1; then
                    {{.PROD_COMPOSE}} run --rm migrate
                else
                    echo "No migrations found, skipping"
                fi
            - '{{.PROD_COMPOSE}} up -d --wait api backup'

    prod:down:
        desc: Stop production environment
        cmds:
            - '{{.PROD_COMPOSE}} down'

    prod:logs:
        desc: Follow production API logs
        cmds:
            - '{{.PROD_COMPOSE}} logs -f --tail=200 api'

    prod:ps:
        desc: Show production containers
        cmds:
            - '{{.PROD_COMPOSE}} ps'

    # Docker logs UI
    logs:up:
        desc: Start the local-only Docker logs UI
        cmds:
            - '{{.LOGS_COMPOSE}} pull'
            - '{{.LOGS_COMPOSE}} up -d --wait'

    logs:down:
        desc: Stop the Docker logs UI without removing its data
        cmds:
            - '{{.LOGS_COMPOSE}} down'

    logs:ps:
        desc: Show Docker logs UI containers
        cmds:
            - '{{.LOGS_COMPOSE}} ps'

    logs:logs:
        desc: Follow Docker logs UI service logs
        cmds:
            - '{{.LOGS_COMPOSE}} logs -f docker-socket-proxy dozzle'

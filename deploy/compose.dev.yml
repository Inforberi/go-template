    #         postgres:
    #             condition: service_healthy
    api:
        image: go-template-dev:1.26
        build:
            context: ..
            dockerfile: deploy/Dockerfile.dev
        env_file:
            - ../.env
        working_dir: /workspace
        command:
            - sh
            - -ec
            - |
                go build -mod=readonly -trimpath -o /tmp/service ./cmd/api
                exec /tmp/service
        ports:
            - '${PORT:?PORT is required}:${PORT}'
        volumes:
            - ..:/workspace
            - go-mod-cache:/go/pkg/mod
            - go-build-cache:/root/.cache/go-build
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        stop_grace_period: 20s

volumes:
    postgres-data:
    go-mod-cache:
        name: go-mod-cache
    go-build-cache:
        name: go-build-cache

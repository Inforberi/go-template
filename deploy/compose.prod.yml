name: ${APP_NAME:?APP_NAME is required}

services:
    postgres:
        image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: '20m'
                max-file: '5'
    migrate:
        image: migrate/migrate:v4.19.1
        volumes:
            - ./migrations:/migrations:ro
        entrypoint:
            - migrate
            - -path=/migrations
            - -database=${DATABASE_URL:?DATABASE_URL is required}
        command: ['up']
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    backup:
        image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
        environment:
            PGHOST: postgres
            PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
            PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
            PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
            BACKUP_DIR: /backups
            BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
            BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
            RESTORE_HEALTHCHECK_SQL: ${RESTORE_HEALTHCHECK_SQL:-SELECT 1}
        volumes:
            - ${BACKUP_HOST_DIR:-./backups}:/backups
            - ./deploy/scripts/postgres-backup.sh:/usr/local/bin/postgres-backup:ro
        entrypoint: ['/bin/bash', '/usr/local/bin/postgres-backup']
        command: ['schedule']
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '20m'
                max-file: '5'

    api:
        build:
            context: .
            dockerfile: deploy/Dockerfile.prod
        env_file:
            - .env.prod
        ports:
            - '${PORT:?PORT is required}:${PORT}'
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        stop_grace_period: 20s
        logging:
            driver: json-file
            options:
                max-size: '20m'
                max-file: '5'

volumes:
    postgres-data:

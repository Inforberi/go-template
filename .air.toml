root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -mod=readonly -trimpath -o ./tmp/api ./cmd/api"
delay = 1000
entrypoint = ["./tmp/api"]
exclude_dir = ["tmp", "vendor", ".git"]
exclude_regex = ["_test.go"]
include_ext = ["go"]
kill_delay = "5s"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
